<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Стоянки Средней Азии и Узбекистана</title>
  <meta name="description" content="Интерактивный научный атлас древнейших стоянок Средней Азии и Узбекистана: карточки, территориальное дерево, SVG-карта, хронологическая шкала и сводная матрица деятельности." />
  <style>
    :root {
      --bg: #F9F7F3;
      --surface: #FFFFFF;
      --surface-muted: #FAF8F5;
      --surface-pill: #F4F1EA;
      --border: #E8E3D9;
      --border-strong: #E2DDD3;
      --border-soft: #EFEBE2;
      --text: #22201B;
      --text-secondary: #5C574E;
      --text-muted: #736E64;
      --text-subtle: #8C877D;
      --accent: #4A502C;
      --accent-hover: #3D4224;
      --radius: 4px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .serif {
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    }

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    /* Header */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .app-title {
      font-size: 28px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.01em;
      line-height: 1.2;
    }

    .app-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }

    .btn:hover {
      background: var(--surface-muted);
      color: var(--text);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent-hover);
      color: #FFFFFF;
      font-weight: 500;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #FFFFFF;
    }

    /* Main Container */
    .main-wrap {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
    }

    /* Smart Search */
    .search-section {
      margin-bottom: 14px;
      position: relative;
      z-index: 20;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 4px 8px 4px 12px;
      gap: 8px;
      transition: border-color 0.15s;
    }

    .search-bar:focus-within {
      border-color: var(--text-muted);
    }

    .search-icon {
      color: var(--text-subtle);
      flex-shrink: 0;
      display: flex;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 13px;
      padding: 6px 0;
      color: var(--text);
    }

    .search-input::placeholder {
      color: #9C978D;
    }

    .filter-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: #423E36;
      font-size: 12px;
      transition: background-color 0.15s, color 0.15s;
    }

    .filter-toggle.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    .suggestions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      font-size: 11px;
      flex-wrap: wrap;
    }

    .suggestions-list {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0;
    }

    .sug-chip {
      padding: 2px 8px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 11px;
      white-space: nowrap;
      transition: background-color 0.15s;
    }

    .sug-chip:hover {
      background: var(--border-soft);
    }

    .filter-panel {
      margin-top: 8px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 14px;
      display: none;
    }

    .filter-panel.open {
      display: block;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
    }

    .filter-label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-subtle);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .filter-select {
      width: 100%;
      padding: 6px 8px;
      font-size: 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
    }

    /* Tabs */
    .tabs-bar {
      display: flex;
      align-items: center;
      gap: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 0 10px 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 16px;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--text);
      font-weight: 600;
      border-bottom-color: var(--accent);
    }

    /* Cards Grid */
    .cards-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .site-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .site-card:hover {
      border-color: #B5AEA0;
      box-shadow: 0 1px 4px rgba(34, 32, 27, 0.05);
    }

    .site-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .site-card-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 26px;
      font-weight: 500;
      line-height: 1.18;
      color: var(--text);
      margin-bottom: 4px;
    }

    .site-card:hover .site-card-title {
      color: var(--accent);
    }

    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      font-size: 11px;
      background: var(--surface-pill);
      color: #423E36;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      margin: 0 4px 4px 0;
    }

    .feature-box {
      background: var(--surface-muted);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin: 10px 0;
      font-size: 12px;
      line-height: 1.5;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Territory Split */
    .territory-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 16px;
      min-height: 600px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 10px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tree-scroll {
      overflow-y: auto;
      max-height: 540px;
      padding-right: 4px;
    }

    .tree-country {
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      margin-bottom: 6px;
      overflow: hidden;
    }

    .tree-country-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 500;
      text-align: left;
    }

    .tree-country-btn:hover {
      background: var(--surface-muted);
    }

    .tree-regions {
      padding: 4px 8px 8px 14px;
      border-top: 1px solid #F2EEE6;
      background: rgba(250, 248, 245, 0.5);
    }

    .tree-site-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      border-radius: var(--radius);
      font-size: 12px;
      text-align: left;
      margin-top: 2px;
    }

    .tree-site-btn:hover {
      background: var(--border-soft);
    }

    .tree-site-btn.active {
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 500;
    }

    /* Timeline */
    .timeline-scroll {
      overflow-x: auto;
      overflow-y: auto;
      padding-bottom: 8px;
      flex: 1;
    }

    .timeline-track {
      display: flex;
      gap: 12px;
      min-width: 100%;
      align-items: stretch;
    }

    .epoch-col {
      flex: 1;
      min-width: 245px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: rgba(250, 248, 245, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .epoch-col-head {
      background: var(--surface);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .epoch-col-body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 440px;
      overflow-y: auto;
    }

    .timeline-site-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .timeline-site-card:hover {
      border-color: #B5AEA0;
      background: var(--surface-muted);
    }

    .timeline-site-card.active {
      background: var(--accent);
      border-color: var(--accent-hover);
      color: #FFFFFF;
    }

    /* Activity Matrix Table */
    .act-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-soft);
    }

    .act-chip {
      padding: 3px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: #423E36;
      font-size: 12px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .act-chip:hover {
      background: var(--surface-pill);
    }

    .act-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
      font-weight: 500;
    }

    .matrix-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      max-height: 540px;
    }

    table.matrix-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 960px;
      text-align: left;
    }

    table.matrix-table thead th {
      position: sticky;
      top: 0;
      background: var(--surface-muted);
      z-index: 5;
      border-bottom: 1px solid var(--border-strong);
      border-right: 1px solid var(--border-soft);
      padding: 9px 8px;
      font-weight: 500;
      font-size: 11px;
      color: var(--text-secondary);
    }

    table.matrix-table tbody tr {
      border-bottom: 1px solid #F2EEE6;
      cursor: pointer;
      transition: background-color 0.12s;
    }

    table.matrix-table tbody tr:hover {
      background: var(--surface-muted);
    }

    table.matrix-table tbody tr.selected {
      background: #F2EEE6;
    }

    table.matrix-table tbody tr.dimmed {
      opacity: 0.35;
    }

    table.matrix-table tbody tr.dimmed:hover {
      opacity: 0.75;
    }

    table.matrix-table td {
      padding: 9px 8px;
      border-right: 1px solid var(--border-soft);
      font-size: 12px;
      vertical-align: middle;
    }

    table.matrix-table td.has-act {
      background: var(--surface-muted);
      text-align: center;
    }

    table.matrix-table td.no-act {
      text-align: center;
      color: #D4CFC5;
    }

    .clusters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
      max-height: 540px;
      overflow-y: auto;
    }

    /* Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      z-index: 50;
      display: none;
      justify-content: flex-end;
    }

    .drawer-backdrop.open {
      display: flex;
    }

    .drawer-panel {
      width: 100%;
      max-width: 660px;
      height: 100%;
      background: var(--surface-muted);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 30px rgba(0, 0, 0, 0.12);
    }

    .drawer-header {
      background: var(--surface);
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-size: 13px;
    }

    .passport-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .section-label {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .content-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      line-height: 1.55;
    }

    .significance-box {
      background: var(--surface-pill);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 12px 14px;
      line-height: 1.55;
    }

    .app-footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 24px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    @media (max-width: 900px) {
      .territory-grid {
        grid-template-columns: 1fr;
      }
      .main-wrap {
        padding: 14px;
      }
      .app-header {
        padding: 14px;
      }
      .passport-box {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      .no-print {
        display: none !important;
      }
      .drawer-backdrop {
        position: static;
        background: none;
        display: block;
      }
      .drawer-panel {
        max-width: 100%;
        box-shadow: none;
        border: none;
      }
    }
  </style>
</head>
<body>
  <header class="app-header no-print">
    <div class="header-inner">
      <div>
        <h1 class="app-title serif">Стоянки Средней Азии и Узбекистана</h1>
        <p class="app-subtitle">Интерактивный научный атлас древнейших стоянок: палеолит, мезолит, неолит, энеолит, бронза, раннее железо</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="window.print()" title="Распечатать в PDF">Печать</button>
      </div>
    </div>
  </header>

  <main class="main-wrap">
    <!-- Smart Search -->
    <section class="search-section no-print">
      <div class="search-bar">
        <span class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input
          id="searchInput"
          class="search-input"
          type="text"
          placeholder="Умный поиск по памятникам, культурам, регионам и синонимам («неандерталец», «петроглифы», «земледелие»)..."
          oninput="handleSearchInput(this.value)"
        />
        <button id="clearSearchBtn" class="btn" style="display:none; padding:4px 8px;" onclick="clearSearch()">✕</button>
        <button id="filterToggleBtn" class="filter-toggle" onclick="toggleFilterPanel()">
          <span>Фильтры</span>
          <span id="filterCountBadge" style="display:none; font-size:10px; font-weight:700;"></span>
        </button>
      </div>

      <div class="suggestions-row">
        <div class="suggestions-list" id="suggestionsList"></div>
        <div style="color: var(--text-subtle);">
          Найдено: <strong id="foundCounter" class="mono" style="color:var(--text);">0</strong> из <span id="totalCounter" class="mono">0</span>
        </div>
      </div>

      <div id="filterPanel" class="filter-panel">
        <div class="filter-grid">
          <div>
            <label class="filter-label">Страна</label>
            <select id="fCountry" class="filter-select" onchange="updateFilters()">
              <option value="">Все страны</option>
              <option value="Узбекистан">Узбекистан</option>
              <option value="Казахстан">Казахстан</option>
              <option value="Кыргызстан">Кыргызстан</option>
              <option value="Таджикистан">Таджикистан</option>
              <option value="Туркменистан">Туркменистан</option>
            </select>
          </div>
          <div>
            <label class="filter-label">Эпоха</label>
            <select id="fEpoch" class="filter-select" onchange="updateFilters()">
              <option value="">Все эпохи</option>
              <option value="Нижний палеолит">Нижний палеолит</option>
              <option value="Средний палеолит">Средний палеолит</option>
              <option value="Верхний палеолит">Верхний палеолит</option>
              <option value="Мезолит">Мезолит</option>
              <option value="Неолит">Неолит</option>
              <option value="Энеолит">Энеолит</option>
              <option value="Бронзовый век">Бронзовый век</option>
              <option value="Ранний железный век">Ранний железный век</option>
            </select>
          </div>
          <div>
            <label class="filter-label">Тип памятника</label>
            <select id="fType" class="filter-select" onchange="updateFilters()">
              <option value="">Любой тип</option>
              <option value="Пещера">Пещера</option>
              <option value="Грот / Навес">Грот / Навес</option>
              <option value="Открытая стоянка">Открытая стоянка</option>
              <option value="Поселение / Городище">Поселение / Городище</option>
              <option value="Могильник / Некрополь">Могильник / Некрополь</option>
              <option value="Наскальные рисунки (петроглифы)">Наскальные рисунки (петроглифы)</option>
              <option value="Кремнёвая мастерская / Карьер">Кремнёвая мастерская / Карьер</option>
            </select>
          </div>
          <div>
            <label class="filter-label">Деятельность</label>
            <select id="fActivity" class="filter-select" onchange="updateFilters()">

      ч:'ch', ш:'sh', щ:'shch', ъ:'', ы:'y', ь:'', э:'e', ю:'yu', я:'ya', ў:"o'", ғ:"g'", қ:'q', ҳ:'h'
    };
    const LAT_TO_CYR = [
      [/shch/gi, 'щ'], [/kh/gi, 'х'], [/zh/gi, 'ж'], [/ch/gi, 'ч'], [/sh/gi, 'ш'],
      [/yo/gi, 'ё'], [/yu/gi, 'ю'], [/ya/gi, 'я'], [/ts/gi, 'ц'],
      [/a/gi,'а'], [/b/gi,'б'], [/c/gi,'к'], [/d/gi,'д'], [/e/gi,'е'], [/f/gi,'ф'],
      [/g/gi,'г'], [/h/gi,'х'], [/i/gi,'и'], [/j/gi,'дж'], [/k/gi,'к'], [/l/gi,'л'],
      [/m/gi,'м'], [/n/gi,'н'], [/o/gi,'о'], [/p/gi,'п'], [/q/gi,'к'], [/r/gi,'р'],
      [/s/gi,'с'], [/t/gi,'т'], [/u/gi,'у'], [/v/gi,'в'], [/w/gi,'в'], [/x/gi,'х'],
      [/y/gi,'й'], [/z/gi,'з']
    ];

    function transliterate(text) {
      const lower = text.toLowerCase();
      let latin = '';
      for (const ch of lower) latin += (CYR_TO_LAT[ch] !== undefined ? CYR_TO_LAT[ch] : ch);
      let cyrillic = lower;
      for (const [pat, repl] of LAT_TO_CYR) cyrillic = cyrillic.replace(pat, repl);
      return { latin, cyrillic };
    }

    function stemRussian(word) {
      let w = word.toLowerCase().trim();
      if (w.length < 4) return w;
      const suffixes = [
        'иями','ями','ами','еми','ейшего','ейшая','ейшее','ого','его','ому','ему',
        'ыми','ими','ых','их','ую','юю','ая','яя','ое','ее','ом','ем','ам','ям',
        'ов','ев','ей','ах','ях','ые','ие','ин','ый','ий','ой','а','е','и','о','у','ы','я','ь'
      ];
      for (const s of suffixes) {
        if (w.endsWith(s) && w.length - s.length >= 3) {
          w = w.slice(0, -s.length);
          break;
        }
      }
      return w;
    }

    const SYNONYMS = {
      'неандерталец': { siteIds: ['teshik-tash', 'angilak', 'obirakhmat'], related: ['мустье', 'мустьерская', 'средний палеолит', 'гоминид', 'ребёнок'] },
      'петроглифы': { siteIds: ['zarautsay', 'sarmyshsay', 'saimaluu-tash', 'tanbaly'], related: ['наскальные', 'рисунки', 'писаницы', 'охра', 'гравюры', 'святилище'] },
      'лошадь': { siteIds: ['botai', 'tanbaly'], related: ['конь', 'кумыс', 'коневодство', 'одомашнивание', 'псалии'] },
      'кумыс': { siteIds: ['botai'], related: ['лошадь', 'кобылье', 'молоко', 'ботайская'] },
      'храм': { siteIds: ['djarkutan', 'gonurdepe', 'altyndepe', 'koy-krylgan-kala'], related: ['святилище', 'огонь', 'алтарь', 'зиккурат', 'жрец'] },
      'рыболовство': { siteIds: ['dzhanbas-kala-4', 'tutkaul', 'dam-dam-cheshme'], related: ['гарпун', 'рыба', 'сом', 'сазан', 'раковины', 'дельты'] },
      'бронза': { siteIds: ['sapallitepa', 'djarkutan', 'bustan-6', 'altyndepe', 'gonurdepe', 'sarazm'], related: ['бронзовый', 'металлургия', 'бмак', 'бактрия', 'маргиана', 'сапалли'] },
      'земледелие': { siteIds: ['jeitun', 'sarazm', 'chust', 'sapallitepa', 'anau', 'namazga-depe'], related: ['зерно', 'пшеница', 'ячмень', 'серп', 'зернотёрка', 'сырец', 'ирригация'] },
      'череп': { siteIds: ['teshik-tash', 'obirakhmat', 'angilak', 'sarazm'], related: ['скелет', 'погребение', 'гоминид', 'антропология', 'неандерталец'] },
      'кремень': { siteIds: ['uchtut', 'kulbulak', 'obirakhmat', 'teshik-tash', 'machay'], related: ['карьер', 'мастерская', 'нуклеус', 'леваллуа', 'микролит', 'отбойник'] }
    };

    function parseNaturalQuery(query) {
      const raw = query.trim();
      const lower = raw.toLowerCase();
      let country, epoch, siteType, activity;
      if (lower.includes('узбекистан')) country = 'Узбекистан';
      else if (lower.includes('казахстан')) country = 'Казахстан';
      else if (lower.includes('кыргызстан') || lower.includes('киргиз')) country = 'Кыргызстан';
      else if (lower.includes('таджикистан')) country = 'Таджикистан';
      else if (lower.includes('туркменистан') || lower.includes('туркмения')) country = 'Туркменистан';

      if (lower.includes('ранний палеолит') || lower.includes('нижний палеолит') || lower.includes('ашель')) epoch = 'Нижний палеолит';
      else if (lower.includes('средний палеолит') || lower.includes('мустье')) epoch = 'Средний палеолит';
      else if (lower.includes('верхний палеолит') || lower.includes('поздний палеолит')) epoch = 'Верхний палеолит';
      else if (lower.includes('мезолит')) epoch = 'Мезолит';
      else if (lower.includes('неолит')) epoch = 'Неолит';
      else if (lower.includes('энеолит') || lower.includes('медно')) epoch = 'Энеолит';
      else if (lower.includes('бронз') || lower.includes('бмак')) epoch = 'Бронзовый век';
      else if (lower.includes('желез') || lower.includes('раннее железо')) epoch = 'Ранний железный век';

      if (lower.includes('пещер')) siteType = 'Пещера';
      else if (lower.includes('грот') || lower.includes('навес')) siteType = 'Грот / Навес';
      else if (lower.includes('петроглиф') || lower.includes('наскальн')) siteType = 'Наскальные рисунки (петроглифы)';
      else if (lower.includes('городищ') || lower.includes('поселен')) siteType = 'Поселение / Городище';
      else if (lower.includes('могильн') || lower.includes('некропол')) siteType = 'Могильник / Некрополь';
      else if (lower.includes('мастерск') || lower.includes('карьер') || lower.includes('рудо')) siteType = 'Кремнёвая мастерская / Карьер';

      if (lower.includes('земледел') || lower.includes('зерно')) activity = 'Земледелие';
      else if (lower.includes('рыболов') || lower.includes('рыб')) activity = 'Рыболовство';
      else if (lower.includes('скотовод') || lower.includes('коневод')) activity = 'Скотоводство';
      else if (lower.includes('металлург') || lower.includes('плавк')) activity = 'Металлургия';
      else if (lower.includes('охот')) activity = 'Охота';

      return { raw, country, epoch, siteType, activity };
    }

    function levenshtein(a, b) {
      const an = a.length, bn = b.length;
      if (!an) return bn;
      if (!bn) return an;
      const m = Array.from({ length: bn + 1 }, (_, i) => [i]);
      for (let j = 0; j <= an; j++) m[0][j] = j;
      for (let i = 1; i <= bn; i++) {
        for (let j = 1; j <= an; j++) {
          m[i][j] = b[i - 1] === a[j - 1]
            ? m[i - 1][j - 1]
            : Math.min(m[i - 1][j - 1] + 1, m[i][j - 1] + 1, m[i - 1][j] + 1);
        }
      }
      return m[bn][an];
    }

    function runSearch(query, filters, favs) {
      const parsed = parseNaturalQuery(query);
      const qClean = parsed.raw;
      const qTokens = qClean.toLowerCase().split(/[\s,.-]+/).filter(Boolean);
      const { latin: qLatin, cyrillic: qCyrillic } = transliterate(qClean);

      const effCountry = filters.country || parsed.country;
      const effEpoch = filters.epoch || parsed.epoch;
      const effType = filters.siteType || parsed.siteType;
      const effActivity = filters.activity || parsed.activity;

      const out = [];
      for (const site of SITES) {
        if (filters.onlyFavorites && !favs.includes(site.id)) continue;
        if (effCountry && site.country !== effCountry) continue;
        if (effEpoch && site.epoch !== effEpoch) continue;
        if (effType && site.siteType !== effType) continue;
        if (effActivity && !site.activities.includes(effActivity)) continue;
        if (filters.status && site.verificationStatus !== filters.status) continue;

        if (qTokens.length === 0) {
          out.push({ site, score: 10 });
          continue;
        }

        let score = 0;
        const nameLower = site.name.toLowerCase();
        const nameClean = nameLower.replace(/[-]/g, ' ');
        const altLower = (site.altNames || []).join(' ').toLowerCase();
        const fullText = [
          site.name, ...(site.altNames || []), site.region, site.culture,
          site.epoch, site.siteType, site.keyFindings, site.researchHistory,
          site.scientificSignificance, ...(site.activities || [])
        ].join(' ').toLowerCase();

        if (nameLower === qClean.toLowerCase() || nameClean === qClean.toLowerCase()) score += 150;
        else if (nameLower.includes(qClean.toLowerCase()) || nameClean.includes(qClean.toLowerCase())) score += 90;

        if (altLower.includes(qLatin) || altLower.includes(qCyrillic)) score += 80;

        for (const [syn, data] of Object.entries(SYNONYMS)) {
          if (qClean.toLowerCase().includes(syn)) {
            if (data.siteIds.includes(site.id)) score += 70;
            if (data.related.some(kw => fullText.includes(kw))) score += 25;
          }
        }

        for (const tok of qTokens) {
          const stem = stemRussian(tok);
          if (nameLower.includes(tok)) score += 40;
          else if (altLower.includes(tok)) score += 30;
          else if (site.culture.toLowerCase().includes(tok)) score += 25;
          else if (site.region.toLowerCase().includes(tok)) score += 20;
          else if (site.keyFindings.toLowerCase().includes(tok)) score += 20;
          else if (fullText.includes(tok)) score += 15;
          else if (fullText.includes(stem)) score += 12;
          else {
            for (const w of nameLower.split(/[\s,.-]+/)) {
              if (Math.abs(w.length - tok.length) <= 2 && tok.length >= 4) {
                const d = levenshtein(w, tok);
                if (d === 1) { score += 25; break; }
                if (d === 2 && tok.length >= 6) { score += 15; break; }
              }
            }
          }
        }
        if (score > 0) out.push({ site, score });
      }
      return out.sort((a, b) => b.score - a.score).map(r => r.site);
    }

                  '<div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">' +
                    '<span class="dot" style="background:' + col.dot + '"></span>' +
                    '<span class="mono" style="font-size:11px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.04em;">' + esc(s.epoch) + '</span>' +
                  '</div>' +
                  '<h3 class="site-card-title">' + esc(s.name) + '</h3>' +
                  ((s.altNames && s.altNames.length) ? '<p style="font-size:11px; color:var(--text-subtle); font-style:italic;">' + esc(s.altNames.join(' • ')) + '</p>' : '') +
                '</div>' +
                '<button class="btn" style="padding:4px 8px; ' + (isFav ? 'background:#FDF6E2; border-color:#E8DEC8; color:#9A7514;' : '') + '" onclick="toggleFavorite(\'' + esc(s.id) + '\', event)" title="В избранное">' + (isFav ? '★' : '☆') + '</button>' +
              '</div>' +
              '<div style="font-size:12px; color:var(--text-secondary); padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid #F2EEE6;">' +
                '<strong style="color:var(--text);">' + esc(s.region) + '</strong> <span style="color:var(--text-subtle);">•</span> ' + esc(s.country) +
              '</div>' +
              '<div style="margin-bottom:8px;">' +
                '<div class="filter-label">Деятельность</div>' +
                '<div>' + s.activities.map(a => '<span class="tag">' + esc(a) + '</span>').join('') + '</div>' +
              '</div>' +
              '<div class="feature-box">' +
                '<div class="filter-label" style="color:var(--accent);">Особенность памятника</div>' +
                '<p class="line-clamp-3">' + esc(s.scientificSignificance) + '</p>' +
              '</div>' +
              '<div style="font-size:11px; color:var(--text-secondary); margin-bottom:10px;">' +
                '<strong style="color:var(--text);">Находки:</strong> <span class="line-clamp-2">' + esc(s.keyFindings) + '</span>' +
              '</div>' +
            '</div>' +
            '<div style="padding-top:10px; border-top:1px solid #F2EEE6; display:flex; justify-content:space-between; align-items:center; font-size:11px;">' +
              '<span class="mono" style="color:var(--text-muted);">' + esc(s.dating.displayLabel.split('(')[0].trim()) + '</span>' +
              '<span style="color:var(--accent); font-weight:500;">Описание ↗</span>' +
            '</div>' +
          '</article>';
        }).join('') +
        '</div>';
    }

    // === VIEW 2: TERRITORY TREE + SVG MAP ===
    function toggleCountry(c) {
      state.expandedCountries[c] = !state.expandedCountries[c];
      renderWorkspace();
    }
    function toggleRegion(r) {
      state.expandedRegions[r] = !state.expandedRegions[r];
      renderWorkspace();
    }
    function zoomMap(d) {
      state.mapZoom = Math.min(3.5, Math.max(0.7, state.mapZoom + d));
      renderWorkspace();
    }
    function resetMap() {
      state.mapZoom = 1;
      renderWorkspace();
    }

    function projectGeo(lat, lng) {
      const minLng = 51.0, maxLng = 85.0, minLat = 35.0, maxLat = 54.5;
      const clLng = Math.max(minLng, Math.min(maxLng, lng));
      const clLat = Math.max(minLat, Math.min(maxLat, lat));
      return {
        x: ((clLng - minLng) / (maxLng - minLng)) * 880 + 30,
        y: ((maxLat - clLat) / (maxLat - minLat)) * 540 + 30
      };
    }

    function renderTerritory(filtered) {
      const filteredSet = new Set(filtered.map(s => s.id));
      const tree = { 'Узбекистан': {}, 'Казахстан': {}, 'Кыргызстан': {}, 'Таджикистан': {}, 'Туркменистан': {} };
      for (const s of SITES) {
        if (!tree[s.country]) tree[s.country] = {};
        if (!tree[s.country][s.region]) tree[s.country][s.region] = [];
        tree[s.country][s.region].push(s);
      }

      const treeHTML = Object.entries(tree).map(([country, regions]) => {
        const cSites = Object.values(regions).flat();
        const cMatch = cSites.filter(s => filteredSet.has(s.id)).length;
        const isOpen = state.expandedCountries[country];
        return '<div class="tree-country">' +
          '<button class="tree-country-btn" onclick="toggleCountry(\'' + esc(country) + '\')">' +
            '<span>' + (isOpen ? '▾ ' : '▸ ') + esc(country) + '</span>' +
            '<span class="mono" style="font-size:11px; padding:1px 6px; border-radius:4px; background:var(--surface-pill); color:var(--text-secondary);">' + cMatch + '</span>' +
          '</button>' +
          (isOpen ? '<div class="tree-regions">' + Object.entries(regions).map(([reg, rSites]) => {
            const rMatch = rSites.filter(s => filteredSet.has(s.id)).length;
            const rOpen = state.expandedRegions[reg];
            return '<div style="border-left:1px solid var(--border-strong); padding-left:8px; margin:4px 0;">' +
              '<button style="width:100%; display:flex; justify-content:space-between; padding:4px 0; font-size:11px; color:var(--text-secondary); text-align:left;" onclick="toggleRegion(\'' + esc(reg) + '\')">' +
                '<span style="font-weight:500;">' + esc(reg) + '</span>' +
                '<span class="mono" style="color:var(--text-subtle);">(' + rMatch + ')</span>' +
              '</button>' +
              (rOpen ? rSites.map(s => {
                const isSel = state.selectedId === s.id;
                const isM = filteredSet.has(s.id);
                const col = EPOCH_COLORS[s.epoch] || { dot: '#888' };
                return '<button class="tree-site-btn ' + (isSel ? 'active' : '') + '" style="' + (!isM && !isSel ? 'opacity:0.35;' : '') + '" onclick="openDrawer(\'' + esc(s.id) + '\')">' +
                  '<span style="display:flex; align-items:center; gap:6px; overflow:hidden;"><span class="dot" style="width:7px; height:7px; background:' + (isSel ? '#fff' : col.dot) + '"></span><span style="truncate">' + esc(s.name) + '</span></span>' +
                  '<span class="mono" style="font-size:10px; opacity:0.75;">' + esc(s.dating.displayLabel.split('(')[0].trim().slice(0, 12)) + '</span>' +
                '</button>';
              }).join('') : '') +
            '</div>';
          }).join('') + '</div>' : '') +
        '</div>';
      }).join('');

      const markersSVG = SITES.map(s => {
        const pt = projectGeo(s.coordinates.lat, s.coordinates.lng);
        const isSel = state.selectedId === s.id;
        const isM = filteredSet.has(s.id);
        const col = EPOCH_COLORS[s.epoch] || { dot: '#4A502C' };
        return '<g transform="translate(' + pt.x + ',' + pt.y + ')" style="cursor:pointer;" opacity="' + (isM ? 1 : 0.22) + '" onclick="openDrawer(\'' + esc(s.id) + '\')">' +
          (isSel ? '<circle r="11" fill="none" stroke="#4A502C" stroke-width="2" />' : '') +
          '<circle r="' + (isSel ? 6.5 : (isM ? 5 : 3.5)) + '" fill="' + col.dot + '" stroke="' + (isSel ? '#FFFFFF' : '#22201B') + '" stroke-width="' + (isSel ? 2 : 1) + '" />' +
          '<circle r="1.5" fill="#FFFFFF" />' +
          ((isM) ? '<text x="0" y="-8" text-anchor="middle" font-size="9" font-family="serif" font-weight="600" fill="#22201B">' + esc(s.name) + '</text>' : '') +
        '</g>';
      }).join('');

      const legendHTML = Object.entries(EPOCH_COLORS).map(([ep, col]) =>
        '<span style="display:inline-flex; align-items:center; gap:4px; white-space:nowrap;"><span class="dot" style="width:7px; height:7px; background:' + col.dot + '"></span><span>' + esc(ep) + '</span></span>'
      ).join('');

      return '<div class="territory-grid">' +
        '<div class="panel">' +
          '<div class="panel-header">' +
            '<h3 class="serif" style="font-size:17px; font-weight:500;">Территории и памятники</h3>' +
            '<span class="mono" style="font-size:11px; background:var(--surface-pill); padding:2px 6px; border-radius:4px; color:var(--text-muted);">' + filtered.length + ' из ' + SITES.length + '</span>' +
          '</div>' +
          '<div class="tree-scroll">' + treeHTML + '</div>' +
        '</div>' +
        '<div class="panel">' +
          '<div class="panel-header">' +
            '<div><h3 class="serif" style="font-size:17px; font-weight:500;">Векторная карта стоянок (офлайн SVG)</h3><span style="font-size:11px; color:var(--text-muted);">Кликните по точке памятника для открытия полной карточки</span></div>' +
            '<div style="display:flex; gap:4px;">' +
              '<button class="btn" onclick="zoomMap(0.25)">+</button>' +
              '<button class="btn" onclick="zoomMap(-0.25)">−</button>' +
              '<button class="btn" onclick="resetMap()">100%</button>' +
            '</div>' +
          '</div>' +
          '<div style="flex:1; overflow:auto; border:1px solid var(--border); border-radius:4px; background:#FAF8F5;">' +
            '<svg viewBox="0 0 940 600" style="width:' + (state.mapZoom * 100) + '%; min-width:100%; display:block;">' +
              '<rect x="0" y="0" width="940" height="600" fill="#FAF8F5" />' +
              '<path d="M 0 0 L 90 0 C 100 120 70 220 95 310 C 110 390 80 480 60 600 L 0 600 Z" fill="#DCE8EE" stroke="#B3CCD6" stroke-width="0.8" />' +
              '<text x="35" y="280" fill="#7593A0" font-size="10" font-family="serif" font-style="italic">Каспий</text>' +
              '<path d="M 230 180 C 265 170 290 190 295 240 C 300 280 270 310 240 310 C 215 310 205 270 210 220 Z" fill="#DCE8EE" stroke="#B3CCD6" stroke-width="0.8" />' +
              '<text x="235" y="245" fill="#7593A0" font-size="9" font-family="serif" font-style="italic">Арал</text>' +
              '<path d="M 680 120 C 720 110 780 115 820 145 C 790 160 740 145 700 150 C 670 140 660 130 680 120 Z" fill="#DCE8EE" stroke="#B3CCD6" stroke-width="0.8" />' +
              '<text x="725" y="135" fill="#7593A0" font-size="9" font-family="serif" font-style="italic">Балхаш</text>' +
              '<ellipse cx="675" cy="255" rx="24" ry="11" fill="#DCE8EE" stroke="#B3CCD6" stroke-width="0.8" />' +
              '<text x="660" y="258" fill="#7593A0" font-size="8" font-family="serif" font-style="italic">Иссык-Куль</text>' +
              '<path d="M 530 430 Q 480 410 440 395 Q 380 390 320 330 Q 275 300 250 295" fill="none" stroke="#98B8C6" stroke-width="1.4" />' +
              '<path d="M 620 280 Q 550 270 480 250 Q 420 220 320 210 Q 280 210 275 215" fill="none" stroke="#98B8C6" stroke-width="1.3" />' +
              '<path d="M 480 340 Q 430 335 380 330 Q 340 330 320 340" fill="none" stroke="#ADC7D3" stroke-width="1" stroke-dasharray="3,2" />' +
              '<path d="M 200 230 L 260 210 L 320 220 L 400 240 L 460 230 L 530 250 L 580 270 L 570 290 L 500 295 L 490 340 L 450 360 L 450 430 L 390 410 L 350 350 L 280 330 L 210 320 Z" fill="none" stroke="#D1C9BC" stroke-width="0.8" stroke-dasharray="4,2" />' +
              '<text x="350" y="275" fill="#B3ACA0" font-size="13" font-family="serif" letter-spacing="4">УЗБЕКИСТАН</text>' +
              '<text x="490" y="100" fill="#B3ACA0" font-size="13" font-family="serif" letter-spacing="4">КАЗАХСТАН</text>' +
              '<text x="680" y="295" fill="#B3ACA0" font-size="11" font-family="serif" letter-spacing="3">КЫРГЫЗСТАН</text>' +
              '<text x="510" y="405" fill="#B3ACA0" font-size="11" font-family="serif" letter-spacing="3">ТАДЖИКИСТАН</text>' +
              '<text x="220" y="415" fill="#B3ACA0" font-size="12" font-family="serif" letter-spacing="3">ТУРКМЕНИСТАН</text>' +
              markersSVG +
            '</svg>' +
          '</div>' +
          '<div style="display:flex; flex-wrap:wrap; gap:10px; font-size:10px; color:var(--text-secondary); padding-top:8px;">' + legendHTML + '</div>' +
        '</div>' +
      '</div>';
    }

    // === VIEW 3: TIMELINE ===
    function zoomTimeline(d) {
      state.timelineZoom = Math.min(2.2, Math.max(0.85, state.timelineZoom + d));
      renderWorkspace();
    }

    function renderTimeline(filtered) {
      const filteredSet = new Set(filtered.map(s => s.id));
      const colsHTML = TIME_COLUMNS.map(col => {
        const epColor = EPOCH_COLORS[col.id] || { dot: '#736E64' };
        const epSites = SITES.filter(s => s.epoch === col.id).sort((a, b) => b.dating.fromYearsBP - a.dating.fromYearsBP);
        const relCultures = CULTURES.filter(c => c.epoch === col.id);

        return '<div class="epoch-col">' +
          '<div class="epoch-col-head" style="border-top:2px solid ' + epColor.dot + ';">' +
            '<div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">' +
              '<span class="serif" style="font-size:15px; font-weight:500;">' + esc(col.label) + '</span>' +
              '<span class="mono" style="font-size:10px; background:var(--surface-pill); padding:1px 6px; border-radius:4px; color:var(--text-secondary);">' + epSites.length + '</span>' +
            '</div>' +
            '<div class="mono" style="font-size:10px; color:var(--text-muted); margin-top:2px;">' + esc(col.sub) + '</div>' +
          '</div>' +
          (relCultures.length ? '<div style="padding:6px 8px; background:rgba(255,255,255,0.7); border-bottom:1px solid var(--border-soft);">' +
            '<div style="font-size:9px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-subtle); margin-bottom:4px;">Культурные горизонты</div>' +
            relCultures.map(c => '<div style="font-size:10px; background:#fff; border:1px solid var(--border); border-radius:4px; padding:3px 6px; margin-bottom:3px;"><div style="font-weight:500;">' + esc(c.name) + '</div><div style="color:var(--text-subtle); font-size:9px;">' + esc(c.label) + '</div></div>').join('') +
          '</div>' : '') +
          '<div class="epoch-col-body">' +
            epSites.map(s => {
              const isSel = state.selectedId === s.id;
              const isM = filteredSet.has(s.id);
              return '<div class="timeline-site-card ' + (isSel ? 'active' : '') + '" style="' + (!isM && !isSel ? 'opacity:0.35;' : '') + '" onclick="openDrawer(\'' + esc(s.id) + '\')">' +
                '<div class="serif" style="font-size:15px; font-weight:500;">' + esc(s.name) + '</div>' +
                '<div style="font-size:11px; opacity:0.8; margin-top:1px;">' + esc(s.country) + ' • ' + esc(s.siteType) + '</div>' +
                '<div class="mono" style="font-size:10px; opacity:0.75; margin-top:3px;">' + esc(s.dating.displayLabel) + '</div>' +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>';
      }).join('');

      return '<div class="panel">' +
        '<div class="panel-header">' +
          '<div><h3 class="serif" style="font-size:17px; font-weight:500;">Хронологическая шкала</h3><p style="font-size:11px; color:var(--text-muted);">От нижнего палеолита (~800 000 л. н.) до раннего железа (~2 000 л. н.)</p></div>' +
          '<div style="display:flex; align-items:center; gap:6px;">' +
            '<span class="mono" style="font-size:11px; color:var(--text-muted);">' + Math.round(state.timelineZoom * 100) + '%</span>' +
            '<button class="btn" onclick="zoomTimeline(0.2)">+</button>' +
            '<button class="btn" onclick="zoomTimeline(-0.2)">−</button>' +
          '</div>' +
        '</div>' +
        '<div class="timeline-scroll"><div class="timeline-track" style="width:' + Math.max(100, state.timelineZoom * 120) + '%;">' + colsHTML + '</div></div>' +
      '</div>';
    }

    // === VIEW 4: ACTIVITY MATRIX TABLE & CLUSTERS ===
    function setActivityMode(m) {
      state.activityMode = m;
      renderWorkspace();
    }
    function setActivityFilter(actId) {
      state.activityFilter = actId;
      renderWorkspace();
    }

    function renderActivity(filtered) {
      const filteredSet = new Set(filtered.map(s => s.id));
      const displayedSites = state.activityFilter === 'ALL'
        ? SITES
        : SITES.filter(s => s.activities.includes(state.activityFilter));

      const chipsHTML = '<button class="act-chip ' + (state.activityFilter === 'ALL' ? 'active' : '') + '" onclick="setActivityFilter(\'ALL\')">Все (' + SITES.length + ')</button>' +
        ACTIVITIES_CONFIG.map(act => {
          const cnt = SITES.filter(s => s.activities.includes(act.id)).length;
          return '<button class="act-chip ' + (state.activityFilter === act.id ? 'active' : '') + '" onclick="setActivityFilter(\'' + esc(act.id) + '\')">' +
            '<span>' + esc(act.title) + '</span>' +
            '<span class="mono" style="font-size:10px; opacity:0.75;">' + cnt + '</span>' +
          '</button>';
        }).join('');

      let bodyHTML = '';
      if (state.activityMode === 'matrix') {
        const rowsHTML = displayedSites.map(s => {
          const isSel = state.selectedId === s.id;
          const isM = filteredSet.has(s.id);
          const col = EPOCH_COLORS[s.epoch] || { dot: '#888' };
          return '<tr class="' + (isSel ? 'selected' : (!isM ? 'dimmed' : '')) + '" onclick="openDrawer(\'' + esc(s.id) + '\')">' +
            '<td>' +
              '<div style="display:flex; align-items:center; gap:6px;">' +
                '<span class="dot" style="width:8px; height:8px; background:' + col.dot + '"></span>' +
                '<strong class="serif" style="font-size:14px; font-weight:500;">' + esc(s.name) + '</strong>' +
                (isSel ? '<span class="mono" style="font-size:10px; color:var(--accent); background:rgba(74,80,44,0.1); padding:1px 5px; border-radius:3px;">выбрано</span>' : '') +
              '</div>' +
              '<div style="font-size:11px; color:var(--text-subtle); margin-top:2px;">' + esc(s.region) + '</div>' +
            '</td>' +
            '<td style="font-size:11px; color:var(--text-secondary);">' + esc(s.epoch) + '</td>' +
            ACTIVITIES_CONFIG.map(act => {
              const has = s.activities.includes(act.id);
              return has
                ? '<td class="has-act" title="' + esc(s.name + ': ' + act.title) + '"><span class="dot" style="width:8px; height:8px; background:var(--accent);"></span></td>'
                : '<td class="no-act">—</td>';
            }).join('') +
          '</tr>';
        }).join('');

        bodyHTML = '<div class="matrix-wrap"><table class="matrix-table">' +
          '<thead><tr>' +
            '<th class="serif" style="min-width:220px; font-size:12px; color:var(--text);">Памятник / Регион</th>' +
            '<th class="serif" style="min-width:110px; font-size:12px; color:var(--text);">Эпоха</th>' +
            ACTIVITIES_CONFIG.map(act => '<th title="' + esc(act.desc) + '" style="text-align:center; max-width:84px; line-height:1.2;">' + esc(act.title) + '</th>').join('') +
          '</tr></thead>' +
          '<tbody>' + rowsHTML + '</tbody>' +
        '</table></div>';
      } else {
        bodyHTML = '<div class="clusters-grid">' +
          ACTIVITIES_CONFIG.filter(a => state.activityFilter === 'ALL' || state.activityFilter === a.id).map(act => {
            const cSites = SITES.filter(s => s.activities.includes(act.id));
            const mCount = cSites.filter(s => filteredSet.has(s.id)).length;
            return '<div class="panel">' +
              '<div class="panel-header" style="margin-bottom:8px;">' +
                '<div><h4 class="serif" style="font-size:15px; font-weight:500;">' + esc(act.title) + '</h4><div style="font-size:10px; color:var(--text-subtle); text-transform:uppercase;">' + esc(act.category) + '</div></div>' +
                '<span class="mono" style="font-size:11px; padding:2px 6px; border-radius:4px; background:var(--surface-pill); border:1px solid var(--border-strong);">' + mCount + ' / ' + cSites.length + '</span>' +
              '</div>' +
              '<div style="font-size:11px; color:var(--text-secondary); background:var(--surface-muted); border:1px solid var(--border-soft); border-radius:4px; padding:8px; margin-bottom:8px;">' +
                '<strong style="color:var(--text);">Признаки и находки:</strong> ' + esc(act.desc) +
              '</div>' +
              '<div style="max-height:210px; overflow-y:auto; display:flex; flex-direction:column; gap:4px;">' +
                cSites.map(s => {
                  const isSel = state.selectedId === s.id;
                  const isM = filteredSet.has(s.id);
                  const col = EPOCH_COLORS[s.epoch] || { dot: '#888' };
                  return '<button class="tree-site-btn ' + (isSel ? 'active' : '') + '" style="border:1px solid var(--border); ' + (!isM && !isSel ? 'opacity:0.4;' : '') + '" onclick="openDrawer(\'' + esc(s.id) + '\')">' +
                    '<span style="display:flex; align-items:center; gap:6px;"><span class="dot" style="width:7px; height:7px; background:' + (isSel ? '#fff' : col.dot) + '"></span><span>' + esc(s.name) + '</span></span>' +
                    '<span class="mono" style="font-size:10px; opacity:0.75;">' + esc(s.country) + '</span>' +
                  '</button>';
                }).join('') +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>';
      }

      return '<div class="panel">' +
        '<div class="panel-header">' +
          '<div><h3 class="serif" style="font-size:17px; font-weight:500;">Деятельность древних обществ</h3><p style="font-size:11px; color:var(--text-muted);">Связь стоянок и находок с хозяйством, ремеслом и верованиями</p></div>' +
          '<div style="display:flex; background:var(--surface-pill); padding:2px; border:1px solid var(--border-strong); border-radius:4px; gap:2px;">' +
            '<button class="btn" style="border:none; ' + (state.activityMode === 'matrix' ? 'background:#fff; color:var(--text); font-weight:500;' : 'background:transparent;') + '" onclick="setActivityMode(\'matrix\')">Сводная матрица</button>' +
            '<button class="btn" style="border:none; ' + (state.activityMode === 'clusters' ? 'background:#fff; color:var(--text); font-weight:500;' : 'background:transparent;') + '" onclick="setActivityMode(\'clusters\')">Кластеры</button>' +
          '</div>' +
        '</div>' +
        '<div class="act-chips">' + chipsHTML + '</div>' +
        bodyHTML +
      '</div>';
    }

    function renderWorkspace() {
      const filtered = getFilteredSites();
      document.getElementById('foundCounter').textContent = filtered.length;
      document.getElementById('totalCounter').textContent = SITES.length;
      document.getElementById('cardsTabCount').textContent = filtered.length;

      const ws = document.getElementById('workspace');
      if (state.tab === 'cards') ws.innerHTML = renderCards(filtered);
      else if (state.tab === 'territory') ws.innerHTML = renderTerritory(filtered);
      else if (state.tab === 'timeline') ws.innerHTML = renderTimeline(filtered);
      else if (state.tab === 'activity') ws.innerHTML = renderActivity(filtered);
    }

    function renderFooter() {
      document.getElementById('footerStats').textContent =
        SITES.length + ' подтверждённых памятников • ' + state.favorites.length + ' в избранном • ' + Object.keys(state.notes).length + ' заметок';
    }

    function renderAll() {
      renderWorkspace();
      renderFooter();
    }

    // Initialize
    initControls();
    renderAll();
  </script>
</body>
</html>
